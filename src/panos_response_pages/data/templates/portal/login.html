<!--
  API category: global-protect-portal-custom-login-page
  Serves: login.esp AND getsoftwarepage.esp -- one import, two forms.
  Shape: BODY FRAGMENT. PAN-OS emits <html> and an OPEN <head>; this file closes
  </head>, supplies the whole <body>, and ends </html>.
  Never write the substitution token literally outside the body -- naming it in
  prose is safe, writing it in a comment is not: PAN-OS substitutes the first
  literal occurrence and is blind to context.
-->
<!--@VARS-->
<script>
var favicon='';
var logo='';
var bg_color='';
var gp_portal_name='';
var gp_portal_name_color='';
var error_text_color='';
</script>
<!--/@VARS-->
<!--
  gp_portal_name stays empty on purpose. PAN-OS' ready handler runs
  $('#heading').html(gp_portal_name) whenever it is non-empty, and the heading
  carries the surface-switching spans, so a value here replaces both and the
  download page shows login wording. The portal name is rendered into the
  #heading markup by the shell instead. bg_color, gp_portal_name_color and
  error_text_color are empty for the general reason: a non-empty value overrides
  the stylesheet at ready time.

  logo is empty too, and that is the change from the first cut of this file.
  PAN-OS' handler puts it in an <img> src, and an <img>-referenced SVG is an
  isolated document -- one asset, no way for the page to tell it which scheme it
  is in. The shell paints #logo as a CSS background instead, choosing between a
  light and a dark copy in a rule the page can reach, so the body carries no img
  for this variable to fill. It also means the mark is painted at first paint
  rather than at $(document).ready, so there is no empty box while jQuery loads.
-->
<!--@HEAD_SCRIPT-->
<script>
[].forEach.call(document.getElementsByTagName('link'),function(l){if(l.rel==='stylesheet'){l.disabled=true;}});
</script>
<!--/@HEAD_SCRIPT-->
<!--
  All four stock sheets go, latofonts.css included: they ship in the Clientless
  VPN content package rather than in this import, and that package has been
  observed to 404 the whole portal/css/ tree after a major upgrade. Nothing
  below asks for Lato.
  No counting loop -- that needs a less-than against links.length, and that
  character must not appear outside a real tag anywhere in this file.
-->
<!--@FOOT_SCRIPT-->
{{PORTAL_I18N}}
<script>
if(document.getElementById('getsoftwarepage_form')){document.documentElement.setAttribute('data-page','sw');}
</script>
<script>
(function(){
{{DL_T}}
var box=document.getElementById('taGetSofewarePage'),dl=document.getElementById('dl');
if(!box||!dl){return;}
var links=[].slice.call(box.querySelectorAll('p a'));
if(!links.length){return;}
var menu=document.getElementById('dlmenu'),main=document.getElementById('dlmain'),
lab=document.getElementById('dllab'),car=document.getElementById('dlcar'),
ua=navigator.userAgent||'',isMac=/Mac/i.test(ua),isWin=/Win/i.test(ua),
x64=/Win64|WOW64|x64|x86_64/i.test(ua),pick=null;
function toggle(v){menu.hidden=!v;car.setAttribute('aria-expanded',v?'true':'false');}
links.forEach(function(a){
var h=a.getAttribute('href')||'',
mac=h.indexOf('platform=mac')!==-1,
win=h.indexOf('platform=windows')!==-1,
w64=h.indexOf('version=64')!==-1;
a.textContent=mac?{{DL_MACOS}}:win?{{DL_WINDOWS}}+(w64?{{DL_BIT64}}:{{DL_BIT32}}):(a.textContent||'').trim();
a.className='dlitem';
menu.appendChild(a);
if(!pick&&((isMac&&mac)||(isWin&&win&&w64===x64))){pick=a;}
});
if(pick){
main.setAttribute('href',pick.getAttribute('href'));
lab.textContent={{DL_DOWNLOADFOR}}+pick.textContent;
}else{
lab.textContent={{DL_CHOOSEDOWNLOAD}};
main.setAttribute('href','#');
main.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();toggle(menu.hidden);});
}
car.addEventListener('click',function(e){e.stopPropagation();toggle(menu.hidden);});
menu.addEventListener('click',function(e){e.stopPropagation();});
document.addEventListener('click',function(){toggle(false);});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){toggle(false);}});
dl.hidden=false;
document.documentElement.setAttribute('data-dl','on');
})();
</script>
<!--/@FOOT_SCRIPT-->
<!--
  The language runtime comes FIRST, and is empty in a single-language build. It
  needs the parsed body and the substituted form -- it swaps PAN-OS' own
  placeholders as well as ours -- so it cannot go in the head, and it has to
  precede the download block below, which reads the dictionary it publishes.

  Emitted at the end of the body, after the form has been substituted and
  parsed. Placed in the head it would run before the download form exists,
  getElementById would return null, and the download page would show login
  wording forever. Login is the default, so a page where this never runs
  degrades to the login copy rather than to nothing.

  The second block is the download button. PAN-OS builds getsoftwarepage.esp as
  three equally weighted links -- Windows 32-bit first -- over three rows of
  prose explaining which one to take. The browser already knows which one to
  take, so this reads the platform out of the user agent and says so.

  Four things it is careful about:

  - It MOVES PAN-OS' anchors into the menu rather than reading their hrefs and
    building new ones. Nothing here writes markup, which it could not do anyway:
    an innerHTML string carrying a '<' would stop the form token being
    substituted. Moving the nodes also means no href is ever retyped.
  - No counting loop, for the same reason -- `i < n` is a raw '<'. slice.call
    turns the NodeList into a real array and forEach does the rest.
  - Bit-ness is only detectable on Windows, via Win64|WOW64|x64|x86_64. An
    unrecognised platform gets the "choose your download" wording and the open
    menu rather than a guess.
  - Its six visible strings are the only copy in this family that is a JS
    LITERAL rather than markup, so they cannot be swapped from the DOM after the
    fact -- the button's text is computed here, from the user agent. The DL_
    placeholders fill them from the strings file instead: the base language's
    quoted literal in a single-language build, and that same literal as the
    fallback arm of a lookup into the published dictionary where there is one.
    So a load that matches no compiled language behaves byte for byte as this
    file did before it was translated.
  - data-dl is set LAST. Everything that hides PAN-OS' own links and description
    rows hangs off it, so if any line above throws, or the script never runs at
    all, the stock page is still sitting there working.
-->
