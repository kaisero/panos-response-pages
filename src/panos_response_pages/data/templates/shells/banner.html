<!DOCTYPE html>
<html lang="en" data-tone="{{TONE}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
:root{
--gr:{{C_GROUND}};--sa:{{C_SURFACE_ALT}};
--ik:{{C_INK}};--im:{{C_INK_MUTED}};--if:{{C_INK_FAINT}};
--ac:{{C_ACCENT}};--ai:{{C_ACCENT_INK}};--at:{{C_ACCENT_TEXT}};--aw:{{C_ACCENT_WASH}};
--wnt:{{C_WARN_TEXT}};--ww:{{C_WARN_WASH}};--ctt:{{C_CRIT_TEXT}};--cw:{{C_CRIT_WASH}};
--tt:var(--at);--tw:var(--aw)}
@media(prefers-color-scheme:dark){:root{
--gr:{{C_D_GROUND}};--sa:{{C_D_SURFACE_ALT}};
--ik:{{C_D_INK}};--im:{{C_D_INK_MUTED}};--if:{{C_D_INK_FAINT}};
--ac:{{C_D_ACCENT}};--ai:{{C_D_ACCENT_INK}};--at:{{C_D_ACCENT_TEXT}};--aw:{{C_D_ACCENT_WASH}};
--wnt:{{C_D_WARN_TEXT}};--ww:{{C_D_WARN_WASH}};--ctt:{{C_D_CRIT_TEXT}};--cw:{{C_D_CRIT_WASH}}}}
<!--@SCHEME-->
html[data-force-scheme=light]{
--gr:{{C_GROUND}};--sa:{{C_SURFACE_ALT}};
--ik:{{C_INK}};--im:{{C_INK_MUTED}};--if:{{C_INK_FAINT}};
--ac:{{C_ACCENT}};--ai:{{C_ACCENT_INK}};--at:{{C_ACCENT_TEXT}};--aw:{{C_ACCENT_WASH}};
--wnt:{{C_WARN_TEXT}};--ww:{{C_WARN_WASH}};--ctt:{{C_CRIT_TEXT}};--cw:{{C_CRIT_WASH}}}
html[data-force-scheme=dark]{
--gr:{{C_D_GROUND}};--sa:{{C_D_SURFACE_ALT}};
--ik:{{C_D_INK}};--im:{{C_D_INK_MUTED}};--if:{{C_D_INK_FAINT}};
--ac:{{C_D_ACCENT}};--ai:{{C_D_ACCENT_INK}};--at:{{C_D_ACCENT_TEXT}};--aw:{{C_D_ACCENT_WASH}};
--wnt:{{C_D_WARN_TEXT}};--ww:{{C_D_WARN_WASH}};--ctt:{{C_D_CRIT_TEXT}};--cw:{{C_D_CRIT_WASH}}}
<!--/@SCHEME-->
html[data-tone=warn]{--tt:var(--wnt);--tw:var(--ww)}
html[data-tone=crit]{--tt:var(--ctt);--tw:var(--cw)}
*{box-sizing:border-box}
html{font-size:16px}
@media(min-width:600px){html{font-size:20px}}
body{margin:0;min-height:100vh;background:var(--gr);color:var(--ik);
font:1rem/1.7 system-ui,sans-serif;
}
.band{background:var(--ac);color:var(--ai);overflow:hidden;
padding:clamp(1.5rem,5vh,2.1rem) 1.5rem clamp(1.9rem,6vh,2.6rem)}
.bandin{position:relative;max-width:44rem;margin:0 auto}
.brand{display:flex;align-items:center;gap:.55rem;margin:0 0 2.2rem}
.brand svg{width:1.25rem;height:1.25rem}
.brand span{font-size:.83rem;font-weight:650;letter-spacing:.03em}
.brand .sev{margin-left:auto;font-size:.6rem;font-weight:700;letter-spacing:.09em;
text-transform:uppercase;color:var(--tt);background:var(--tw);
padding:.25rem .7rem;border-radius:999px}
.sev:empty{display:none}
h1{position:relative;margin:0;font-size:clamp(2.1rem,7vw,3.4rem);line-height:.98;
letter-spacing:-.045em;font-weight:800;text-wrap:balance;max-width:11em}
/* The per-page mark, kept subordinate to the heading: this design's focal point
   is the type, and a second full-strength indicator would compete with it. */
.ghost{position:absolute;right:0;bottom:-1.2rem;opacity:.18;pointer-events:none}
.ghost svg{width:7rem;height:7rem}
main{width:100%;max-width:44rem;margin:0 auto;padding:2.1rem 1.5rem 3.5rem;
display:grid;grid-template-columns:1fr 13.5rem;gap:2.2rem}
.col{min-width:0}
.gloss{margin:0 0 1.7rem;font-size:1rem;line-height:1.7;color:var(--im);max-width:30rem}
/* align-self:start, or the rule runs the full height of the prose column and
   trails a long empty line under the last fact on the shorter pages. */
dl{margin:0;align-self:start;display:flex;flex-direction:column;gap:.95rem;
border-left:2px solid var(--ac);padding-left:1rem}
.f{display:flex;flex-direction:column;gap:.15rem;min-width:0}
dt{font-size:.55rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
color:var(--if)}
dd{margin:0;font-size:.75rem;font-weight:600;overflow-wrap:anywhere}
/* Production puts Address first, where the prototype had it last in muted type.
   Reordering with order: would desync the visual order from the DOM order the
   mailto builder reads, so the long value is quietened instead. */
dd.mono{font-family:ui-monospace,Consolas,monospace;font-size:.62rem;
font-weight:500;color:var(--im);line-height:1.5}
.acts{display:flex;flex-wrap:wrap;align-items:center;gap:.75rem 1.1rem}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:3rem;
padding:.75rem 1.6rem;border-radius:.2rem;background:var(--ac);color:var(--ai);text-decoration:none;
font-size:.97rem;font-weight:650;border:1px solid transparent;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.acts form{margin:0;display:inline-flex}
.acts input[type=submit],.acts input[type=button],.acts button{
font:inherit;font-size:.97rem;font-weight:650;min-height:3rem;padding:.75rem 1.6rem;
border-radius:.2rem;border:1px solid var(--sa);background:var(--sa);color:var(--ik);
cursor:pointer;-webkit-appearance:none;appearance:none}
.acts input[type=submit]:hover,.acts button:hover{filter:brightness(.96)}
.plain{width:100%;font-size:.86rem;color:var(--if);margin:0}
.plain a,.note a{color:var(--at)}
.infobox,.warnline{display:flex;align-items:flex-start;gap:.6rem;margin:1.7rem 0 0;
padding:.9rem 1rem;border-radius:.3rem;background:var(--sa);
border-left:3px solid var(--at);color:var(--ik);font-size:.87rem;line-height:1.55}
.infobox>svg,.warnline>svg{flex:none;width:1.15rem;height:1.15rem;
margin-top:.12rem;color:var(--at)}
.infobox>span,.warnline>span{flex:1;min-width:0}
.warnline{border-left-color:var(--tt)}
.warnline>svg{color:var(--tt)}
.note{margin:2rem 0 0;font-size:.85rem;color:var(--if);line-height:1.6}
a:focus-visible,.btn:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--tt);
outline-offset:3px}
@media(max-width:600px){
.band{padding:1.4rem 1.15rem 1.8rem}
.brand{margin-bottom:1.6rem}
.ghost svg{width:5rem;height:5rem}
/* One column. The record drops below the action rather than above it: on a
   phone the thing to do outranks the detail that explains it. */
main{grid-template-columns:1fr;gap:1.9rem;padding:1.7rem 1.15rem 2.5rem}
dl{border-left:0;border-top:2px solid var(--ac);padding:1rem 0 0}
.acts>.btn,.acts>form{flex:1 1 auto}
.acts>form input{width:100%}
.acts{gap:.6rem}}
{{REDIRECT_CSS}}
</style>
</head>
<body>
<header class="band"><div class="bandin">
<p class="brand">{{LOGO_SVG}}<span>{{COMPANY}}</span><span class="sev">{{SEVERITY}}</span></p>
<h1>{{HEADLINE}}</h1>
<div class="ghost" aria-hidden="true">{{MARK}}</div>
</div></header>
<main>
<div class="col">
{{REDIRECT}}
<p class="gloss" id="gloss">{{GLOSS}}</p>
<div class="acts">{{ACTIONS}}</div>
{{EXTRA}}
</div>
<dl>{{FACTS}}</dl>
</main>
{{SCRIPTS}}
</body>
</html>
