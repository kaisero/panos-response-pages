<!DOCTYPE html>
<html lang="en" data-tone="{{TONE}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="pragma" content="no-cache">
<title>{{TITLE}}</title>
<style>
:root{
--gr:{{C_GROUND}};--sa:{{C_SURFACE_ALT}};
--ik:{{C_INK}};--im:{{C_INK_MUTED}};--if:{{C_INK_FAINT}};
--ac:{{C_ACCENT}};--ai:{{C_ACCENT_INK}};--at:{{C_ACCENT_TEXT}};--aw:{{C_ACCENT_WASH}};
--wn:{{C_WARN}};--wni:{{C_WARN_INK}};--wnt:{{C_WARN_TEXT}};--ww:{{C_WARN_WASH}};--ct:{{C_CRIT}};--cti:{{C_CRIT_INK}};--ctt:{{C_CRIT_TEXT}};--cw:{{C_CRIT_WASH}};
--ob:.28;--gf:88%;--gd:.45;
--tt:var(--at);--tw:var(--aw)}
@media(prefers-color-scheme:dark){:root{
--gr:{{C_D_GROUND}};--sa:{{C_D_SURFACE_ALT}};
--ik:{{C_D_INK}};--im:{{C_D_INK_MUTED}};--if:{{C_D_INK_FAINT}};
--ac:{{C_D_ACCENT}};--ai:{{C_D_ACCENT_INK}};--at:{{C_D_ACCENT_TEXT}};--aw:{{C_D_ACCENT_WASH}};
--wn:{{C_D_WARN}};--wni:{{C_D_WARN_INK}};--wnt:{{C_D_WARN_TEXT}};--ww:{{C_D_WARN_WASH}};--ct:{{C_D_CRIT}};--cti:{{C_D_CRIT_INK}};--ctt:{{C_D_CRIT_TEXT}};--cw:{{C_D_CRIT_WASH}};--ob:.20;--gf:92%;--gd:.30}}
html[data-force-scheme=light]{
--gr:{{C_GROUND}};--sa:{{C_SURFACE_ALT}};
--ik:{{C_INK}};--im:{{C_INK_MUTED}};--if:{{C_INK_FAINT}};
--ac:{{C_ACCENT}};--ai:{{C_ACCENT_INK}};--at:{{C_ACCENT_TEXT}};--aw:{{C_ACCENT_WASH}};
--wn:{{C_WARN}};--wni:{{C_WARN_INK}};--wnt:{{C_WARN_TEXT}};--ww:{{C_WARN_WASH}};--ct:{{C_CRIT}};--cti:{{C_CRIT_INK}};--ctt:{{C_CRIT_TEXT}};--cw:{{C_CRIT_WASH}};--ob:.28;--gf:88%;--gd:.45}
html[data-force-scheme=dark]{
--gr:{{C_D_GROUND}};--sa:{{C_D_SURFACE_ALT}};
--ik:{{C_D_INK}};--im:{{C_D_INK_MUTED}};--if:{{C_D_INK_FAINT}};
--ac:{{C_D_ACCENT}};--ai:{{C_D_ACCENT_INK}};--at:{{C_D_ACCENT_TEXT}};--aw:{{C_D_ACCENT_WASH}};
--wn:{{C_D_WARN}};--wni:{{C_D_WARN_INK}};--wnt:{{C_D_WARN_TEXT}};--ww:{{C_D_WARN_WASH}};--ct:{{C_D_CRIT}};--cti:{{C_D_CRIT_INK}};--ctt:{{C_D_CRIT_TEXT}};--cw:{{C_D_CRIT_WASH}};--ob:.20;--gf:92%;--gd:.30}
html[data-tone=warn]{--tt:var(--wnt);--tw:var(--ww)}
html[data-tone=crit]{--tt:var(--ctt);--tw:var(--cw)}
*{box-sizing:border-box}
html{font-size:16px}
@media(min-width:600px){html{font-size:20px}}
body{margin:0;min-height:100vh;background:var(--gr);color:var(--ik);
font:1rem/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
-webkit-font-smoothing:antialiased}
.field{position:fixed;inset:0;overflow:hidden;pointer-events:none}
/* Hairlines, not a dot screen -- the only radial here is the mask that fades
   the grid out, which paints nothing. Unsupported, the grid simply covers the
   whole field instead of fading: cosmetic, never unreadable. */
.gridf{position:absolute;inset:0;opacity:var(--gd);
background-image:linear-gradient(var(--sa) 1px,transparent 1px),
linear-gradient(90deg,var(--sa) 1px,transparent 1px);
background-size:1.6rem 1.6rem;
-webkit-mask-image:radial-gradient(circle at 70% 100%,#000,transparent 72%);
mask-image:radial-gradient(circle at 70% 100%,#000,transparent 72%)}
.o1{position:absolute;top:-10rem;left:-5rem;width:27rem;height:27rem;border-radius:50%;
background:var(--ac);filter:blur(2.5rem);opacity:var(--ob);
animation:fl 12s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-.6rem)}}
main{position:relative;width:100%;max-width:31rem;margin:0 auto;
padding:clamp(1.8rem,7vh,3.4rem) 1.5rem 3.5rem}
.brand{display:flex;align-items:center;gap:.55rem;color:var(--at);margin:0 0 1.3rem}
.brand svg{width:1.25rem;height:1.25rem}
.brand span{font-size:.83rem;font-weight:600;letter-spacing:.03em}
.brand .sev{margin-left:auto;font-size:.6rem;font-weight:700;letter-spacing:.09em;
text-transform:uppercase;color:var(--tt);background:var(--tw);
padding:.25rem .7rem;border-radius:999px}
.sev:empty{display:none}
/* Solid fill first: dropped rather than fallen back, the panel would have no
   background and its text would sit straight on the grid and the disc. */
.pane{border-radius:1rem;border:1px solid var(--aw);padding:1.8rem 1.7rem 1.6rem;
box-shadow:0 1.2rem 3rem rgba(0,0,0,.14);
background:var(--gr);
background:color-mix(in oklab,var(--gr) var(--gf),transparent);
-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.ind{width:3rem;height:3rem;border-radius:.9rem;background:var(--tw);color:var(--tt);
display:grid;place-items:center;margin:0 0 1.1rem}
.ind svg{width:1.6rem;height:1.6rem}
h1{margin:0 0 .55rem;font-size:1.65rem;line-height:1.15;letter-spacing:-.03em;font-weight:650;
text-wrap:balance}
.gloss{margin:0 0 1.4rem;color:var(--im);font-size:.92rem;line-height:1.7}
dl{margin:0 0 1.5rem;border-top:1px solid var(--sa)}
.f{display:flex;gap:.8rem;padding:.5rem 0;border-bottom:1px solid var(--sa)}
dt{width:5rem;flex:none;font-size:.66rem;color:var(--if)}
dd{margin:0;min-width:0;font-size:.71rem;font-weight:600;overflow-wrap:anywhere}
dd.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.65rem;
font-weight:500}
.acts{display:flex;flex-wrap:wrap;align-items:center;gap:.65rem 1rem}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:2.7rem;
padding:.65rem 1.4rem;border-radius:.55rem;background:var(--ac);color:var(--ai);text-decoration:none;
font-size:.85rem;font-weight:650;border:1px solid transparent;cursor:pointer;
box-shadow:0 .5rem 1.2rem rgba(0,0,0,.18)}
.btn:hover{filter:brightness(1.08)}
.acts form{margin:0;display:inline-flex}
.acts input[type=submit],.acts input[type=button],.acts button{
font:inherit;font-size:.85rem;font-weight:650;min-height:2.7rem;padding:.65rem 1.4rem;
border-radius:.55rem;border:1px solid var(--aw);background:var(--sa);color:var(--ik);
cursor:pointer;-webkit-appearance:none;appearance:none}
.acts input[type=submit]:hover,.acts button:hover{filter:brightness(.96)}
.plain{width:100%;font-size:.76rem;color:var(--if);margin:0}
.plain a,.note a{color:var(--at)}
.infobox,.warnline{display:flex;align-items:flex-start;gap:.55rem;margin:1.3rem 0 0;
padding:.7rem .8rem;border-radius:.55rem;background:var(--sa);
border-left:3px solid var(--at);color:var(--ik);font-size:.76rem;line-height:1.55}
.infobox>svg,.warnline>svg{flex:none;width:1rem;height:1rem;margin-top:.15rem;color:var(--at)}
.infobox>span,.warnline>span{flex:1;min-width:0}
.warnline{border-left-color:var(--tt)}
.warnline>svg{color:var(--tt)}
.note{margin:1.3rem 0 0;font-size:.74rem;color:var(--if);line-height:1.6}
a:focus-visible,.btn:focus-visible,button:focus-visible{outline:3px solid var(--tt);
outline-offset:3px}
@media(max-width:600px){
main{padding:1.75rem 1.15rem 2.5rem}
.pane{padding:1.4rem 1.25rem 1.3rem}
h1{font-size:1.55rem}
.acts>.btn,.acts>form{flex:1 1 auto}
.acts>form input{width:100%}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="field" aria-hidden="true"><span class="gridf"></span><span class="o1"></span></div>
<main>
<p class="brand">{{LOGO_SVG}}<span>{{COMPANY}}</span><span class="sev">{{SEVERITY}}</span></p>
<div class="pane">
<div class="ind">{{MARK}}</div>
<h1>{{HEADLINE}}</h1>
<p class="gloss" id="gloss">{{GLOSS}}</p>
<dl>{{FACTS}}</dl>
<div class="acts">{{ACTIONS}}</div>
{{EXTRA}}
</div>
</main>
{{SCRIPTS}}
</body>
</html>
