<!DOCTYPE html>
<html lang="en" data-tone="{{TONE}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
:root{
--gr:{{C_GROUND}};--sa:{{C_SURFACE_ALT}};
--ik:{{C_INK}};--im:{{C_INK_MUTED}};--if:{{C_INK_FAINT}};
--ac:{{C_ACCENT}};--ai:{{C_ACCENT_INK}};--at:{{C_ACCENT_TEXT}};--aw:{{C_ACCENT_WASH}};
--wnt:{{C_WARN_TEXT}};--ww:{{C_WARN_WASH}};--ctt:{{C_CRIT_TEXT}};--cw:{{C_CRIT_WASH}};
--tt:var(--at);--tw:var(--aw)}
@media(prefers-color-scheme:dark){:root{
--gr:{{C_D_GROUND}};--sa:{{C_D_SURFACE_ALT}};
--ik:{{C_D_INK}};--im:{{C_D_INK_MUTED}};--if:{{C_D_INK_FAINT}};
--ac:{{C_D_ACCENT}};--ai:{{C_D_ACCENT_INK}};--at:{{C_D_ACCENT_TEXT}};--aw:{{C_D_ACCENT_WASH}};
--wnt:{{C_D_WARN_TEXT}};--ww:{{C_D_WARN_WASH}};--ctt:{{C_D_CRIT_TEXT}};--cw:{{C_D_CRIT_WASH}}}}
<!--@SCHEME-->
html[data-force-scheme=light]{
--gr:{{C_GROUND}};--sa:{{C_SURFACE_ALT}};
--ik:{{C_INK}};--im:{{C_INK_MUTED}};--if:{{C_INK_FAINT}};
--ac:{{C_ACCENT}};--ai:{{C_ACCENT_INK}};--at:{{C_ACCENT_TEXT}};--aw:{{C_ACCENT_WASH}};
--wnt:{{C_WARN_TEXT}};--ww:{{C_WARN_WASH}};--ctt:{{C_CRIT_TEXT}};--cw:{{C_CRIT_WASH}}}
html[data-force-scheme=dark]{
--gr:{{C_D_GROUND}};--sa:{{C_D_SURFACE_ALT}};
--ik:{{C_D_INK}};--im:{{C_D_INK_MUTED}};--if:{{C_D_INK_FAINT}};
--ac:{{C_D_ACCENT}};--ai:{{C_D_ACCENT_INK}};--at:{{C_D_ACCENT_TEXT}};--aw:{{C_D_ACCENT_WASH}};
--wnt:{{C_D_WARN_TEXT}};--ww:{{C_D_WARN_WASH}};--ctt:{{C_D_CRIT_TEXT}};--cw:{{C_D_CRIT_WASH}}}
<!--/@SCHEME-->
html[data-tone=warn]{--tt:var(--wnt);--tw:var(--ww)}
html[data-tone=crit]{--tt:var(--ctt);--tw:var(--cw)}
*{box-sizing:border-box}
@media(min-width:600px){html{font-size:1.25rem}}
body{margin:0;min-height:100vh;background:var(--gr);color:var(--ik);
border-top:.375rem solid transparent;
border-image:linear-gradient({{C_GRAD_ANGLE}},{{C_GRAD_FROM}},{{C_GRAD_TO}}) 1;
font:1rem/1.7 system-ui,sans-serif;
display:flex;justify-content:center;
padding:clamp(2rem,9vh,5rem) 1.5rem 3.5rem}
main{width:100%;max-width:36rem}
.brand{display:flex;align-items:center;gap:.55rem;color:var(--at);margin:0 0 2rem}
.brand svg{width:1.25rem;height:1.25rem}
.brand span{font-size:.83rem;font-weight:600;letter-spacing:.03em}
.brand .sev{margin-left:auto;font-size:.68rem;font-weight:700;letter-spacing:.09em;
text-transform:uppercase;color:var(--tt);background:var(--tw);
padding:.25rem .7rem;border-radius:999px}
.sev:empty{display:none}
/* Two children, always: the mark and everything beside it. The text used to be
   loose grid items with the mark spanning two rows, which meant the column each
   one landed in depended on how many there were -- so an optional slot between
   the headline and the gloss pushed the gloss into the mark's column and left
   the headline in a 138 px gutter. min-width:0 because a grid item's default
   min-width is its content, which a long unbroken URL would push the column past. */
.hd{display:grid;grid-template-columns:auto 1fr;gap:0 1.15rem;align-items:start}
.hdt{min-width:0}
.hd .ind{width:3.4rem;height:3.4rem;border-radius:50%;background:var(--tw);
color:var(--tt);display:grid;place-items:center;margin-top:.15rem}
.hd .ind svg{width:1.9rem;height:1.9rem}
h1{margin:0 0 .7rem;font-size:2rem;line-height:1.15;letter-spacing:-.028em;font-weight:650;
text-wrap:balance}
.gloss{margin:0 0 2rem;color:var(--im);font-size:1.05rem;line-height:1.72;max-width:32rem}
dl{margin:0 0 2.1rem;display:flex;flex-direction:column;gap:0}
.f{display:flex;flex-direction:column;gap:1px;padding:.8rem 0;
border-bottom:1px solid var(--sa)}
.f:first-child{border-top:1px solid var(--sa)}
dt{font-size:.79rem;color:var(--if)}
dd{margin:0;font-size:.96rem;font-weight:600;overflow-wrap:anywhere}
dd.mono{font-family:ui-monospace,Consolas,monospace;font-size:.89rem;
font-weight:500}
.acts{display:flex;flex-wrap:wrap;align-items:center;gap:.75rem 1.1rem}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:3rem;
padding:.75rem 1.5rem;border-radius:.6rem;background:var(--ac);color:var(--ai);text-decoration:none;
font-size:.97rem;font-weight:600;border:1px solid transparent;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.acts form{margin:0;display:inline-flex}
.acts input[type=submit],.acts input[type=button],.acts button{
font:inherit;font-size:.97rem;font-weight:600;min-height:3rem;padding:.75rem 1.5rem;
border-radius:.6rem;border:1px solid var(--sa);background:var(--sa);color:var(--ik);
cursor:pointer;-webkit-appearance:none;appearance:none}
.acts input[type=submit]:hover,.acts button:hover{filter:brightness(.96)}
.plain{width:100%;font-size:.86rem;color:var(--if);margin:0}
.plain a,.note a{color:var(--at)}
.infobox,.warnline{display:flex;align-items:flex-start;gap:.6rem;margin:1.7rem 0 0;
padding:.9rem 1rem;border-radius:.75rem;background:var(--sa);
border-left:3px solid var(--at);color:var(--ik);font-size:.87rem;line-height:1.55}
.infobox>svg,.warnline>svg{flex:none;width:1.15rem;height:1.15rem;
margin-top:.12rem;color:var(--at)}
.infobox>span,.warnline>span{flex:1;min-width:0}
.warnline{border-left-color:var(--tt)}
.warnline>svg{color:var(--tt)}
.note{margin:2rem 0 0;font-size:.85rem;color:var(--if);line-height:1.6}
a:focus-visible,.btn:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--tt);
outline-offset:3px}
@media(max-width:600px){
body{padding:1.75rem 1.15rem 2.5rem}
.hd{grid-template-columns:1fr;gap:0}
.hd .ind{width:2.8rem;height:2.8rem;margin:0 0 .9rem}
.hd .ind svg{width:1.55rem;height:1.55rem}
h1{font-size:1.7rem}
.gloss{font-size:1rem;margin-bottom:26px}
.acts>.btn,.acts>form{flex:1 1 auto}
.acts>form input{width:100%}
.acts{gap:.6rem}}
{{REDIRECT_CSS}}
</style>
</head>
<body>
<main>
<p class="brand">{{LOGO_SVG}}<span>{{COMPANY}}</span><span class="sev">{{SEVERITY}}</span></p>
<div class="hd">
<div class="ind">{{MARK}}</div>
<div class="hdt">
<h1>{{HEADLINE}}</h1>
{{REDIRECT}}
<p class="gloss" id="gloss">{{GLOSS}}</p>
</div>
</div>
<dl>{{FACTS}}</dl>
<div class="acts">{{ACTIONS}}</div>
{{EXTRA}}
</main>
{{SCRIPTS}}
</body>
</html>
