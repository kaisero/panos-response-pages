<!DOCTYPE html>
<html lang="en" data-tone="{{TONE}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
:root{
--gr:{{C_GROUND}};--sa:{{C_SURFACE_ALT}};
--ik:{{C_INK}};--im:{{C_INK_MUTED}};--if:{{C_INK_FAINT}};
--ac:{{C_ACCENT}};--ai:{{C_ACCENT_INK}};--at:{{C_ACCENT_TEXT}};--aw:{{C_ACCENT_WASH}};
--wnt:{{C_WARN_TEXT}};--ww:{{C_WARN_WASH}};--ctt:{{C_CRIT_TEXT}};--cw:{{C_CRIT_WASH}};
--tt:var(--at);--tw:var(--aw)}
@media(prefers-color-scheme:dark){:root{
--gr:{{C_D_GROUND}};--sa:{{C_D_SURFACE_ALT}};
--ik:{{C_D_INK}};--im:{{C_D_INK_MUTED}};--if:{{C_D_INK_FAINT}};
--ac:{{C_D_ACCENT}};--ai:{{C_D_ACCENT_INK}};--at:{{C_D_ACCENT_TEXT}};--aw:{{C_D_ACCENT_WASH}};
--wnt:{{C_D_WARN_TEXT}};--ww:{{C_D_WARN_WASH}};--ctt:{{C_D_CRIT_TEXT}};--cw:{{C_D_CRIT_WASH}}}}
<!--@SCHEME-->
html[data-force-scheme=light]{
--gr:{{C_GROUND}};--sa:{{C_SURFACE_ALT}};
--ik:{{C_INK}};--im:{{C_INK_MUTED}};--if:{{C_INK_FAINT}};
--ac:{{C_ACCENT}};--ai:{{C_ACCENT_INK}};--at:{{C_ACCENT_TEXT}};--aw:{{C_ACCENT_WASH}};
--wnt:{{C_WARN_TEXT}};--ww:{{C_WARN_WASH}};--ctt:{{C_CRIT_TEXT}};--cw:{{C_CRIT_WASH}}}
html[data-force-scheme=dark]{
--gr:{{C_D_GROUND}};--sa:{{C_D_SURFACE_ALT}};
--ik:{{C_D_INK}};--im:{{C_D_INK_MUTED}};--if:{{C_D_INK_FAINT}};
--ac:{{C_D_ACCENT}};--ai:{{C_D_ACCENT_INK}};--at:{{C_D_ACCENT_TEXT}};--aw:{{C_D_ACCENT_WASH}};
--wnt:{{C_D_WARN_TEXT}};--ww:{{C_D_WARN_WASH}};--ctt:{{C_D_CRIT_TEXT}};--cw:{{C_D_CRIT_WASH}}}
<!--/@SCHEME-->
html[data-tone=warn]{--tt:var(--wnt);--tw:var(--ww)}
html[data-tone=crit]{--tt:var(--ctt);--tw:var(--cw)}
*{box-sizing:border-box}
@media(min-width:600px){html{font-size:1.25rem}}
body{margin:0;min-height:100vh;background:var(--gr);color:var(--ik);
font:1rem/1.7 system-ui,sans-serif;
}
.rule{height:.2rem;background:var(--ac)}
.bar{border-bottom:1px solid var(--sa)}
.brand{display:flex;align-items:center;gap:.55rem;color:var(--at);
margin:0 auto;max-width:36rem;padding:.85rem 1.5rem}
.brand svg{width:1.25rem;height:1.25rem}
.brand span{font-size:.83rem;font-weight:600;letter-spacing:.03em}
main{width:100%;max-width:36rem;margin:0 auto;padding:clamp(1.8rem,7vh,3.4rem) 1.5rem 3.5rem}
.sev{margin:0 0 .6rem;font-size:.62rem;font-weight:700;letter-spacing:.14em;
text-transform:uppercase;color:var(--tt)}
.sev:empty{display:none}
.ind{width:2.8rem;height:2.8rem;border-radius:50%;background:var(--tw);color:var(--tt);
display:grid;place-items:center;margin:0 0 1.1rem}
.ind svg{width:1.55rem;height:1.55rem}
h1{margin:0 0 .7rem;font-size:1.9rem;line-height:1.15;letter-spacing:-.028em;font-weight:650;
text-wrap:balance}
.gloss{margin:0 0 2rem;color:var(--im);font-size:1rem;line-height:1.72;max-width:32rem}
dl{margin:0 0 2.1rem;display:grid;grid-template-columns:7rem 1fr;
border-top:1px solid var(--sa)}
/* display:contents generates no box, so the row's padding and hairline have to
   live on dt AND dd -- on .f they would simply not render. */
.f{display:contents}
dt,dd{padding:.62rem 0;border-bottom:1px solid var(--sa)}
dt{font-size:.72rem;color:var(--if)}
dd{margin:0;font-size:.82rem;font-weight:600;overflow-wrap:anywhere}
dd.mono{font-family:ui-monospace,Consolas,monospace;font-size:.76rem;
font-weight:500}
.acts{display:flex;flex-wrap:wrap;align-items:center;gap:.75rem 1.1rem}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:3rem;
padding:.75rem 1.5rem;border-radius:.35rem;background:var(--ac);color:var(--ai);text-decoration:none;
font-size:.97rem;font-weight:600;border:1px solid transparent;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.acts form{margin:0;display:inline-flex}
.acts input[type=submit],.acts input[type=button],.acts button{
font:inherit;font-size:.97rem;font-weight:600;min-height:3rem;padding:.75rem 1.5rem;
border-radius:.35rem;border:1px solid var(--sa);background:var(--sa);color:var(--ik);
cursor:pointer;-webkit-appearance:none;appearance:none}
.acts input[type=submit]:hover,.acts button:hover{filter:brightness(.96)}
.plain{width:100%;font-size:.86rem;color:var(--if);margin:0}
.plain a,.note a{color:var(--at)}
.infobox,.warnline{display:flex;align-items:flex-start;gap:.6rem;margin:1.7rem 0 0;
padding:.9rem 1rem;border-radius:.45rem;background:var(--sa);
border-left:3px solid var(--at);color:var(--ik);font-size:.87rem;line-height:1.55}
.infobox>svg,.warnline>svg{flex:none;width:1.15rem;height:1.15rem;
margin-top:.12rem;color:var(--at)}
.infobox>span,.warnline>span{flex:1;min-width:0}
.warnline{border-left-color:var(--tt)}
.warnline>svg{color:var(--tt)}
.note{margin:2rem 0 0;font-size:.85rem;color:var(--if);line-height:1.6}
a:focus-visible,.btn:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--tt);
outline-offset:3px}
@media(max-width:600px){
.brand{padding:.8rem 1.15rem}
main{padding:1.75rem 1.15rem 2.5rem}
h1{font-size:1.7rem}
.gloss{margin-bottom:26px}
/* display:contents cannot be stacked -- the grid has to be dismantled and the
   row put back on .f, or every label and value collapses into one column. */
dl{display:block;border-top:0}
.f{display:flex;flex-direction:column;gap:1px;padding:.8rem 0;
border-bottom:1px solid var(--sa)}
.f:first-child{border-top:1px solid var(--sa)}
dt,dd{padding:0;border-bottom:0}
.acts>.btn,.acts>form{flex:1 1 auto}
.acts>form input{width:100%}
.acts{gap:.6rem}}
{{REDIRECT_CSS}}
</style>
</head>
<body>
<div class="rule"></div>
<header class="bar"><p class="brand">{{LOGO_SVG}}<span>{{COMPANY}}</span></p></header>
<main>
<p class="sev">{{SEVERITY}}</p>
<div class="ind">{{MARK}}</div>
<h1>{{HEADLINE}}</h1>
{{REDIRECT}}
<p class="gloss" id="gloss">{{GLOSS}}</p>
<dl>{{FACTS}}</dl>
<div class="acts">{{ACTIONS}}</div>
{{EXTRA}}
</main>
{{SCRIPTS}}
</body>
</html>
