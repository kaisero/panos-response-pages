<!--
  URL Filtering and Category Match Block Page
  API category: url-block-page
  Tokens available: <user/> <url/> <category/>
-->

<!--@TITLE-->{{T_TITLE}}<!--/@TITLE-->

<!--@TONE-->calm<!--/@TONE-->

<!--@MARK--><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7.5 12 3l8 4.5v5.2c0 4.6-3.3 8.5-8 9.3-4.7-.8-8-4.7-8-9.3Z"/><path d="m9 12.3 2.1 2.1 4-4.3"/></svg><!--/@MARK-->

<!--@HEADLINE-->{{T_HEADLINE}}<!--/@HEADLINE-->

<!--@GLOSS-->{{T_GLOSS}}<!--/@GLOSS-->

<!--@FACTS-->
<div class="f"><dt>{{T_FACT1}}</dt><dd class="mono"><url/></dd></div>
<div class="f"><dt>{{T_FACT2}}</dt><dd id="cat"><category/></dd></div>
<div class="f"><dt>{{T_FACT3}}</dt><dd><user/></dd></div>
<div class="f"><dt>{{T_FACT4}}</dt><dd id="ts"></dd></div>
<!--/@FACTS-->

<!--@ACTIONS-->
<a class="btn" id="rep"{{CONTACT_TO}} data-subject="{{T_REPORT_SUBJECT}}"
   data-intro="{{T_REPORT_INTRO}}" data-prompt="{{T_REPORT_PROMPT}}"
   href="{{CONTACT_HREF}}">{{T_REPORT_LABEL}}</a>
{{CONTACT_ALT}}
<!--/@ACTIONS-->

<!--
  The pre-filled mailto, used only when the config sets supportEmail. It lives in
  its own section because its body is this page's copy, and only this file can say
  what belongs in it.

  Keep it on ONE line. parse_sections() strips the section's outer whitespace but
  not its interior, so a newline introduced by reformatting lands inside the href.

  <url/> stays LAST: PAN-OS expands it at serve time, and a raw "&" in the
  expanded address terminates the body parameter, dropping every field after it.
-->
<!--@CONTACT_MAILTO-->mailto:{{SUPPORT_EMAIL}}<!--/@CONTACT_MAILTO-->

<!--@CONTACT_ALT--><p class="plain">{{T_CONTACT_ALT1}}<a href="mailto:{{SUPPORT_EMAIL}}">{{SUPPORT_EMAIL}}</a>{{T_CONTACT_ALT2}}</p><!--/@CONTACT_ALT-->

<!--@EXTRA-->
<p class="infobox">{{INFO_MARK}}<span>{{T_EXTRA}}</span></p>
<!--/@EXTRA-->
