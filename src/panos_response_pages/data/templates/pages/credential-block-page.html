<!--
  Anti Phishing Block Page
  API category: credential-block-page
  Tokens available: <user/> <url/> <category/>

  Highest-stakes page in the set: shown while the user is actively submitting
  corporate credentials to a site classified as phishing. Tone is fixed to crit
  rather than left to the category map -- credential submission to any restricted
  category warrants the serious treatment.
-->

<!--@TITLE-->{{T_TITLE}}<!--/@TITLE-->

<!--@TONE-->crit<!--/@TONE-->

<!--@COPY_LOCK-->1<!--/@COPY_LOCK-->

<!--@MARK--><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10.5" width="16" height="10" rx="2.5"/><path d="M8 10.5V7.6a4 4 0 0 1 8 0v2.9"/><path d="M12 14.4v2.3"/></svg><!--/@MARK-->

<!--@HEADLINE-->{{T_HEADLINE}}<!--/@HEADLINE-->

<!--@GLOSS-->{{T_GLOSS}}<!--/@GLOSS-->

<!--@FACTS-->
<div class="f"><dt>{{T_FACT1}}</dt><dd class="mono"><url/></dd></div>
<div class="f"><dt>{{T_FACT2}}</dt><dd id="cat"><category/></dd></div>
<div class="f"><dt>{{T_FACT3}}</dt><dd><user/></dd></div>
<div class="f"><dt>{{T_FACT4}}</dt><dd id="ts"></dd></div>
<!--/@FACTS-->

<!--@ACTIONS-->
<a class="btn" id="rep"{{CONTACT_TO}} data-subject="{{T_REPORT_SUBJECT}}"
   data-intro="{{T_REPORT_INTRO}}" data-prompt="{{T_REPORT_PROMPT}}"
   href="{{CONTACT_HREF}}">{{T_REPORT_LABEL}}</a>
{{CONTACT_ALT}}
<!--/@ACTIONS-->

<!--@CONTACT_MAILTO-->mailto:{{SUPPORT_EMAIL}}<!--/@CONTACT_MAILTO-->

<!--@CONTACT_ALT--><p class="plain">{{T_CONTACT_ALT1}}<a href="mailto:{{SUPPORT_EMAIL}}">{{SUPPORT_EMAIL}}</a>{{T_CONTACT_ALT2}}</p><!--/@CONTACT_ALT-->

<!--@EXTRA-->
<p class="infobox">{{INFO_MARK}}<span>{{T_EXTRA}}</span></p>
<!--/@EXTRA-->
