<!--
  Antivirus Block Page
  API category: virus-block-page
  Tokens available: <user/> <fname/>

  The shipped PAN-OS default uses only <fname/>. <user/> is documented as being
  available on every response page, but is absent from this default -- verify it
  renders on your platform before relying on it. <threatname/> is community-
  attested only and is deliberately not used: an unsupported token renders as
  nothing, leaving a blank field on a live page.

  Tone is fixed to crit: an antivirus hit is a threat verdict, not a policy
  preference, and there is no category token here to derive severity from.
-->
