<!--
  Application Block Page
  API category: application-block-page
  Tokens available: <user/> <appname/>   -- NO url, NO category

  <appname/> is the App-ID name of the blocked application, so it renders a
  machine identifier ("bittorrent", "ms-rdp") rather than a product name. It gets
  the mono treatment for the same reason the URL does: the user may have to read
  it back to IT.

  Tone is calm, and deliberately so. An application block is a policy preference,
  not a threat verdict -- the same reasoning that keeps url-block-page calm until
  its category map raises it. There is no <category/> token here to raise it from,
  so this page stays calm always.

  VERIFY ON A LIVE FIREWALL: the shipped PAN-OS default for this page uses both
  <user/> and <appname/>, so both are expected to render. Confirm anyway -- an
  unsupported token renders as nothing, leaving a blank field.
-->
