<!--
  File Blocking Continue Page
  API category: file-block-continue-page
  Tokens available: <user/> <fname/> <cookie/>

  <cookie/> is the continue mechanism: PAN-OS injects markup that sets a cookie
  and reloads to resume the download. It is treated like <pan_form/> -- placed in
  the action row and styled by the .acts input/button rules.

  VERIFY ON A LIVE FIREWALL: whether <cookie/> renders a visible control. If it
  injects only a script, this page needs its own visible Continue affordance.
-->

<!--@TITLE-->{{T_TITLE}}<!--/@TITLE-->

<!--@TONE-->warn<!--/@TONE-->

<!--@COPY_LOCK-->1<!--/@COPY_LOCK-->

<!--@MARK--><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5v11"/><path d="m7.5 10 4.5 4.5 4.5-4.5"/><path d="M4.5 19.5h15"/></svg><!--/@MARK-->

<!--@HEADLINE-->{{T_HEADLINE}}<!--/@HEADLINE-->

<!--@GLOSS-->{{T_GLOSS}}<!--/@GLOSS-->

<div class="f"><dt>{{T_FACT3}}</dt><dd id="ts"></dd></div>
<!--/@FACTS-->
