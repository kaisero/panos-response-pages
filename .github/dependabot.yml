version: 2
updates:
  # Needs a committed uv.lock, which this repo has.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    # Without this, Dependabot opens against the default branch (main).
    # Integration happens on develop, so that is where updates belong.
    target-branch: "develop"
    groups:
      python-dependencies:
        patterns: ["*"]

  # Actions are pinned by SHA, so this is the only thing that moves them.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Without this, Dependabot opens against the default branch (main).
    # Integration happens on develop, so that is where updates belong.
    target-branch: "develop"
    groups:
      github-actions:
        patterns: ["*"]
