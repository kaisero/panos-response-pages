name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build, publish and release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      # Must match the environment named on the PyPI trusted publisher, or the
      # OIDC exchange fails with invalid-publisher.
      name: pypi
      url: https://pypi.org/p/panos-response-pages
    # A job-level block replaces the workflow default, so both are listed here:
    # contents:write for `gh release create`, id-token:write for PyPI OIDC.
    # Listing only id-token is the classic way to get a 403 from gh.
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.11"

      # Extraction runs BEFORE the build so a missing changelog section fails
      # fast, rather than after producing artifacts nobody can describe.
      - name: Extract release notes
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          test -f CHANGELOG.md || { echo "::error::CHANGELOG.md is missing."; exit 1; }
          awk -v ver="$VERSION" '
            /^## \[/ { if (found) exit; if (index($0, "[" ver "]")) { found=1; next } }
            /^\[.*\]: http/ { next }
            found { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::Missing CHANGELOG.md section '## [$VERSION]'. Add release notes before tagging."
            exit 1
          fi

      - name: Check the tag matches the packaged version
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          DECLARED=$(uv run python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          if [ "$VERSION" != "$DECLARED" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject.toml version $DECLARED."
            exit 1
          fi

      - name: Build
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md dist/*
