name: Secrets

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "37 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  # gitleaks-action 403s on pull_request events without this.
  pull-requests: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: the pre-commit hook can be skipped with --no-verify,
          # so this is the backstop and needs to see what already landed.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The action does not pick up .gitleaks.toml from the repository root
          # the way the CLI and the pre-commit hook do, so the allowlist has to
          # be pointed at explicitly or the scan runs on stock rules.
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml
