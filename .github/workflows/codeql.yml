name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 3 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze Python
    # Code scanning is free on public repositories and requires GitHub Advanced
    # Security on private ones ("Advanced security has not been purchased"), so
    # this is a no-op while the repo is private and enables itself if that
    # changes. Left in place rather than deleted: the analysis is wanted, only
    # the plan is missing.
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A job-level permissions block REPLACES the workflow default rather than
    # extending it, so contents: read has to be repeated here or checkout 128s.
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          languages: python
          queries: security-extended
      - uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
