name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 3 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze Python
    # Code scanning is free on public repositories and requires GitHub Advanced
    # Security on private ones ("Advanced security has not been purchased"), so
    # this is a no-op while the repo is private and enables itself if that
    # changes. Left in place rather than deleted: the analysis is wanted, only
    # the plan is missing.
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A job-level permissions block REPLACES the workflow default rather than
    # extending it, so contents: read has to be repeated here or checkout 128s.
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: python
          queries: security-extended
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
