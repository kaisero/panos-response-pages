site_name: panos-response-pages
site_description: Self-contained PAN-OS URL Filtering and Anti-Phishing response pages
site_url: https://kaisero.github.io/panos-response-pages/
repo_url: https://github.com/kaisero/panos-response-pages
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - content.code.copy
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/weather-night, name: Switch to dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/weather-sunny, name: Switch to light mode}

# Flat on purpose: test_docs.py reads each entry as a single path, so a nested
# section yields a list and raises TypeError.
nav:
  - Home: index.md
  - CLI: cli.md
  - Styles: styles.md
  - Copy rules: copy-rules.md
  - Customising: customising.md
  - GlobalProtect portal: portal.md
  - Architecture: architecture/general.md
  - GP login page: architecture/globalprotect-portal-login-page.md
  - GP home page: architecture/globalprotect-portal-home-page.md
  - URL filtering pages: architecture/url-filtering-response-pages.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
            show_root_heading: true
            members_order: source

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - toc:
      permalink: true
